# The power management coprocessor's driver, before the root is unlocked: an
# encrypted root otherwise waits out "PMP driver did not bind within 20000 ms"
# with apple-pmp.ko still on that root. Added only when modinfo names a module.
_omarchy_mac_pmp_path=$(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename apple_pmp 2>/dev/null) &&
  [[ $_omarchy_mac_pmp_path == /* ]] && MODULES+=(apple_pmp)
unset _omarchy_mac_pmp_path

# Apple SoC CPU cluster DVFS driver, before the root is unlocked so Argon2id
# runs at scaled clocks rather than the firmware boot clock. Added only when
# modinfo names a module.
_omarchy_mac_cpufreq_path=$(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename apple_soc_cpufreq 2>/dev/null) &&
  [[ $_omarchy_mac_cpufreq_path == /* ]] && MODULES+=(apple_soc_cpufreq)
unset _omarchy_mac_cpufreq_path

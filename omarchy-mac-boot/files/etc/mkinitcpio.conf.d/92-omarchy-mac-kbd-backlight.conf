# The keyboard backlight at the passphrase prompt. leds_pwm drives it through
# pwm-apple, which a kernel can build as a module left on the encrypted root;
# the udev rule then turns the LED on as it appears. Added only as a module.
_omarchy_mac_kbd_pwm_path=$(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename pwm-apple 2>/dev/null) &&
  [[ $_omarchy_mac_kbd_pwm_path == /* ]] && MODULES+=(pwm-apple)
[[ -f /usr/lib/udev/rules.d/90-omarchy-mac-kbd-backlight.rules ]] &&
  FILES+=(/usr/lib/udev/rules.d/90-omarchy-mac-kbd-backlight.rules)
unset _omarchy_mac_kbd_pwm_path

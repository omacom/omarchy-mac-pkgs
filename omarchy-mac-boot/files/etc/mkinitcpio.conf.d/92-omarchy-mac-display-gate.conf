# The display path the kernel's display gate waits for, before the root is
# unlocked. On a 16-inch M4 Pro (J616s) the gate waits 10 s for the DP PHY
# driver; with phy-apple-t6040-usb2.ko still on an encrypted root, a first boot
# (the in-place LUKS conversion brings the root up at about 60 s) or a slow
# passphrase entry gives up and both external DCPs fail with -110. An image's
# initramfs is built away from the Mac, so autodetect cannot pick these. Each
# is added only when modinfo names it as a module of the target kernel.
for _omarchy_mac_display_module in phy-apple-t6040-usb2 mux-apple-display-crossbar atc-t6050-dp phy-apple-atc; do
  _omarchy_mac_display_path=$(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename "$_omarchy_mac_display_module" 2>/dev/null) &&
    [[ $_omarchy_mac_display_path == /* ]] && MODULES+=("$_omarchy_mac_display_module")
done
unset _omarchy_mac_display_module _omarchy_mac_display_path

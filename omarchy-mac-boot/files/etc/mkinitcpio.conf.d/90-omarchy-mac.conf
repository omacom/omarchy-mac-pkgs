# Generated by the Omarchy Apple Silicon image builder.
# A line that already lists asahi (Asahi Alarm's stock line) still needs
# omarchy-vendorfw: 91 turns it into a systemd image, which never runs the
# busybox asahi runscript. A busybox encrypt line stays on busybox, where the
# asahi runscript unpacks the firmware, so it is left alone.
_omarchy_asahi_hooks=()
_omarchy_asahi_added=false
_omarchy_asahi_keep=false
for _omarchy_asahi_hook in "${HOOKS[@]}"; do
  [[ $_omarchy_asahi_hook == encrypt || $_omarchy_asahi_hook == omarchy-vendorfw ]] && _omarchy_asahi_keep=true
done
for _omarchy_asahi_hook in "${HOOKS[@]}"; do
  if [[ $_omarchy_asahi_hook == asahi ]]; then
    _omarchy_asahi_added=true
  fi
  if [[ $_omarchy_asahi_hook == filesystems && $_omarchy_asahi_added == false ]]; then
    _omarchy_asahi_hooks+=(asahi omarchy-vendorfw)
    _omarchy_asahi_added=true
  fi
  _omarchy_asahi_hooks+=("$_omarchy_asahi_hook")
  if [[ $_omarchy_asahi_hook == asahi && $_omarchy_asahi_keep == false ]]; then
    _omarchy_asahi_hooks+=(omarchy-vendorfw)
    _omarchy_asahi_keep=true
  fi
done
if [[ $_omarchy_asahi_added == false ]]; then
  _omarchy_asahi_hooks+=(asahi omarchy-vendorfw)
fi
HOOKS=("${_omarchy_asahi_hooks[@]}")
unset _omarchy_asahi_hooks _omarchy_asahi_hook _omarchy_asahi_added _omarchy_asahi_keep

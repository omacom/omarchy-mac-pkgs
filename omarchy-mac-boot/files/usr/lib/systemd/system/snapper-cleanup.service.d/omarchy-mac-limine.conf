[Service]
# Replace limine-snapper-sync 1.32.1-2's post list; keep its cleanup-lock removal.
# ExecStartPre and Snapper's ExecStart remain unchanged.
ExecStopPost=
ExecStopPost=-/usr/bin/rm -f /run/limine-snapper-cleanup.lock
ExecStopPost=/usr/lib/omarchy/mac-boot/snapper-cleanup-sync
# Omarchy's 5 s default stop timeout also bounds the post list, and the menu sync,
# run at the cleanup's idle priority, can take longer: a kill left the menu stale.
TimeoutStopSec=1min

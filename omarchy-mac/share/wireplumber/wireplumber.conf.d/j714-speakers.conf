# J714 (MacBook Pro 14" M5): the six speakers are PCM 1 of the macaudio card, which asahi-audio already names
# RawSpeakers but has no graph for. The J714 graph (asahi-audio's j314 FIRs, crossover and limiters) goes on top.
node.software-dsp.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleJ714,1" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/share/omarchy-mac/j714/speakers.json"
        hide-parent = true
      }
    }
  }
]

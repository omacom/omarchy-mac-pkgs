# Run the external displays' DisplayPort/HDMI audio (the DCP audio cards,
# "Apple DisplayPort") on period interrupts instead of PipeWire's timer-based
# scheduling. Under the timer the J714c (M5 Max, 7.3 kernel) feeds a monitor
# about 3.5k frames a second, its speakers break up and playback slows; with
# period interrupts the stream runs at 48 kHz.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-audio-controller-.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
      }
    }
  }
]

# Switch output to the headphone jack when headphones are plugged in.
# Required: an optional feature loads only when another component wants it.
wireplumber.components = [
  {
    name = omarchy-mac/headphones-on-plug.lua, type = script/lua
    provides = custom.omarchy-mac-headphones-on-plug
  }
]

wireplumber.profiles = {
  main = {
    custom.omarchy-mac-headphones-on-plug = required
  }
}

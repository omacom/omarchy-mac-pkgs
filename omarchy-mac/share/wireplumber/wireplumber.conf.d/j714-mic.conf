# J714 (MacBook Pro 14" M5): the microphone array is PCM 0 of the AOP card. asahi-audio has no J714 entry, so
# the raw array gets its RawMics name here and the J714 graph (gain, 120 Hz high-pass, limiter) on top of it.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleJ714AOP,0" }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.platform-sound.RawMics"
        node.description = "Raw Mic Device (do not use)"
        node.nick = "RawMics"
      }
    }
  }
]

node.software-dsp.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleJ714AOP,0" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/share/omarchy-mac/j714/mic.json"
        hide-parent = true
      }
    }
  }
]

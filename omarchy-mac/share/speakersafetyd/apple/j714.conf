# speakersafetyd 2.0.1 profile for MacBook Pro 14-inch M5 Max (J714c), acoustic ID 40.
# Checked on a J714c (2026-11-06/07): sense channels, V/I scales and the daemon's gain loop. The thermal
# constants are NOT measured for AID40: they are the J716 bring-up values (j316.conf made conservative).
# speakersafetyd strips the trailing letters of the first DT compatible ("apple,j714c" -> apple/j714.conf)
# and opens hw:AppleJ714, the card id macaudio derives from the DT model "MacBook Pro J714".
#
# Sources:
# - visense_pcm 2: macaudio's third front end, "Speaker Sense". channels 12: six amps x (I, V), 16-bit
#   (J714c ADT /arm-io/admac-base-ns/base-ns-adma-rx-0).
# - t_hysteresis, t_window, period, link_gains, uclamp_max: the values speakersafetyd's docs/audump.py
#   writes for every spp3 machine. 2.0.1 does not read link_gains.
# - t_ambient, group, tr_coil, tr_magnet, tau_coil, tau_magnet, t_limit, t_headroom: j316.conf with
#   t_limit 140 -> 120 and tr_coil, tr_magnet x1.25 (m5pro-linux's J716 profile). AID40's own values
#   are in macOS's speaker tuning (audump.py's input), not read yet.
# - [Controls]: the tas2764 driver's control names under each amp's sound-name-prefix; the daemon finds
#   all of them on hw:AppleJ714.
# - Names and order: the DT sound-name-prefix, J714c ADT speakerN order (LW1 RW1 LW2 RW2 LT RT).
# - is_chan 2n, vs_chan 2n+1: DT ti,imon/vmon-slot-no. Measured: each speaker's tone on its own pair,
#   V and I not swapped, positive power.
# - is_scale 3.75, vs_scale 14: SN012776 sense full scale (audump.py). Measured: |V| matches the drive
#   within 0.2 dB (woofers, 1 kHz) and 0.5 dB (tweeters, 4 kHz); the i2c3 amps (RW1 RW2 RT) read V and I
#   at 2x, hence 1.875 and 7.
# - z_nominal: ADT /product/audio/speaker-thiele-small r_mohm spA0..spA5. Measured Re(V/I): woofers
#   3.78-3.98 ohm (+2..+7%), tweeters 3.70-3.76. 2.0.1 uses it only for min_gain.
# - z_shunt, a_t_20c, a_t_35c: j316.conf; 2.0.1 does not read them.
# Known limit: LW1's I sample lags its V by one sample, so 2.0.1 under-reads LW1 above 1 kHz (-32% at
# 4 kHz). asahi-audio's j314/graph-j714.json (branch j714, under test) gives LW1 and LW2 the same signal,
# its woofer filter 81 dB down at 4 kHz.
# Kernel: amp gain 15 (18.5 dBV, ADT); unlocked, no volume ceiling; while this daemon does not hold the
# controls, the volumes sit at raw 1 (silent).

[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer 1]
group = 1
tr_coil = 28.75
tr_magnet = 50.00
tau_coil = 5.60
tau_magnet = 197.25
t_limit = 120.0
t_headroom = 10.0
z_nominal = 3.746
z_shunt = 0.09
a_t_20c = 0.00374895
a_t_35c = 0.00354903
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1


# speakersafetyd profile for MacBook Pro 14-inch M5 Max (J714c), acoustic ID 40.
# BRING-UP PROFILE, NOT VALIDATED ON HARDWARE. Install as
# /usr/share/speakersafetyd/apple/j714.conf (speakersafetyd strips the trailing
# letters of the first DT compatible, "apple,j714c", and opens hw:AppleJ714,
# the card id macaudio derives from the DT model "MacBook Pro J714").
#
# Where each value comes from:
# - Speaker names and order: the DT sound node (t6050-j714c.dts), which follows
#   the J714c ADT speakerN order: audio-speaker = LW1, speaker1 RW1, speaker2
#   LW2, speaker3 RW2, speaker4 LT, speaker5 RT. The control names are
#   "<name> VSENSE Switch" etc., from each amp's sound-name-prefix.
# - is_chan/vs_chan: amp n carries I in sense channel 2n and V in 2n+1 of the
#   12-channel sense PCM (DT ti,imon-slot-no 4n / ti,vmon-slot-no 4n+2, the
#   tas2764/J516 convention; the ADT speaker-config labels them the other way
#   round). Same map as m5pro-linux's j716.conf; j316.conf's order differs.
# - channels = 12, 16-bit words: J714c ADT /arm-io/admac-base-ns/base-ns-adma-rx-0
#   (max-channel-count 12, max-bit-depth-bits 16). visense_pcm = 2: macaudio's
#   third front end, "Speaker Sense". CHECK before first use: the sense PCM is
#   S16_LE on this machine; speakersafetyd must open it in that format.
# - z_nominal per speaker: J714c ADT /product/audio/speaker-thiele-small
#   r_mohm spA0..spA5 = 3746 3648 3729 3698 3730 3729 (assumed to be in the
#   speakerN order above; all six are within 0.1 ohm, so the order barely
#   matters). J716s measures 3.29-3.39 and j316.conf uses 3.60.
# - Amp constants copied unchanged from j316.conf via j716.conf (SN012776 on
#   every machine in this family): is_scale 3.75, vs_scale 14, z_shunt 0.09,
#   a_t_20c / a_t_35c (copper voice-coil tempco), amp_gain control name.
# - Thermal model (tr_coil, tr_magnet, tau_coil, tau_magnet, t_limit,
#   t_headroom): NOT known for AID40. Copied from the J716 bring-up profile,
#   which is j316.conf made more conservative: t_limit 120 (j316: 140),
#   tr_coil and tr_magnet x1.25 (j316 woofers 23/40, tweeters 45/50),
#   tau_* as j316. Loosening them needs measured data from this machine.
# - t_ambient 50 (pessimistic cold start), t_hysteresis, t_window, period,
#   link_gains, uclamp_max: j716.conf / j316.conf.
# The kernel side holds the volume at -30 dB (macaudio j714 max_vol) and the
# amp gain at 10 (ADT 15) while this profile is unvalidated.

[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer 1]
group = 1
tr_coil = 28.75
tr_magnet = 50.00
tau_coil = 5.60
tau_magnet = 197.25
t_limit = 120.0
t_headroom = 10.0
z_nominal = 3.746
z_shunt = 0.09
a_t_20c = 0.00374895
a_t_35c = 0.00354903
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1


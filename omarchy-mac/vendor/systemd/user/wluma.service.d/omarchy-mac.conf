# Automatic brightness is on for every Mac that has a light sensor; "omarchy brightness auto off" masks the unit.
# Upstream restarts every 5 s; a prepare that keeps failing (the panel is gone) would retry all session, so bound it:
# two starts within two minutes and the unit stops for this login. ExecCondition (ready) failing does not restart.
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=2

[Service]
ExecCondition=/usr/bin/omarchy-brightness-auto ready
ExecStartPre=/usr/bin/omarchy-brightness-auto prepare

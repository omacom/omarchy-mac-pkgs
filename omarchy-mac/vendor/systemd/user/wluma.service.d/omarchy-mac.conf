# Automatic brightness is on for every Mac that has a light sensor; "omarchy brightness auto off" masks the unit.
# Upstream restarts every 5 s. A prepare that keeps failing would retry all session, so the start limit is
# narrowed: five starts within two minutes and automatic retries stop; "on" or the next login starts it again
# ("on" clears the failed state first). An ExecCondition (ready) failure never restarts and never counts.
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
ExecCondition=/usr/bin/omarchy-brightness-auto ready
ExecStartPre=/usr/bin/omarchy-brightness-auto prepare

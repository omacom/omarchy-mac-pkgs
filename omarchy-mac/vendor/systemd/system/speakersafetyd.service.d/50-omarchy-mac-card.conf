[Service]
# The preset starts speakersafetyd at boot, but the speaker card registers from udev
# coldplug and can come later; the first start then panics (snd_ctl_open ENODEV) and
# systemd restarts it a second later. Wait for the udev queue so it opens the card once.
# speakersafetyd is already After=sysinit.target, which udev's coldplug runs before.
ExecStartPre=-/usr/bin/udevadm settle --timeout=10

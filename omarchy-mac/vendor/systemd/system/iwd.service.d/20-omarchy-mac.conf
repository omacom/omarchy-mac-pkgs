# iwd loads the first main.conf in this list, so /etc/iwd/main.conf replaces the Apple default; iwd-config
# links the N1 one into /run on that chip only. "+" runs it outside iwd's read-only sandbox.
[Service]
Environment=CONFIGURATION_DIRECTORY=/etc/iwd:/run/omarchy-mac/iwd:/usr/lib/omarchy-mac/iwd
ExecStartPre=-+/usr/lib/omarchy-mac/iwd-config

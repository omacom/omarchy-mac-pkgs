# Apple Silicon default for the iwd that NetworkManager drives. An
# /etc/iwd/main.conf replaces this whole file.
#
# Leave roaming to the firmware. Apple Silicon Wi-Fi is fullmac, so a roam iwd
# starts drops the link, and NetworkManager reports the failed rejoin as a
# wrong password. -100 dBm keeps iwd from ever starting one.
[General]
RoamThreshold=-100
RoamThreshold5G=-100
CriticalRoamThreshold=-100
CriticalRoamThreshold5G=-100

# Keep joins off 6 GHz. The BCM4388 firmware runs SAE itself, and a join it
# makes on a 6 GHz access point reports connected and authorized while the
# access point drops everything the Mac sends, so DHCP never completes. With
# 6 GHz off, a network that also offers 5 GHz joins there. Chips without
# 6 GHz are unaffected.
[Rank]
BandModifier6GHz=0.0

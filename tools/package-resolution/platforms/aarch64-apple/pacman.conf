# Apple Silicon: the aarch64 edge channel in omarchy-mac's template order,
# Omarchy first, then the Asahi repositories and Arch Linux ARM.
[options]
Architecture = aarch64

[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch

[asahi-alarm]
Server = https://github.com/asahi-alarm/asahi-alarm/releases/download/$arch

[core]
Server = https://arm-mirror.omarchy.org/$arch/$repo

[extra]
Server = https://arm-mirror.omarchy.org/$arch/$repo

[alarm]
Server = https://arm-mirror.omarchy.org/$arch/$repo

[aur]
Server = https://arm-mirror.omarchy.org/$arch/$repo

# Plain aarch64: the aarch64 edge channel without Asahi repositories.
[options]
Architecture = aarch64

[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch

[core]
Server = https://arm-mirror.omarchy.org/$arch/$repo

[extra]
Server = https://arm-mirror.omarchy.org/$arch/$repo

[alarm]
Server = https://arm-mirror.omarchy.org/$arch/$repo

[aur]
Server = https://arm-mirror.omarchy.org/$arch/$repo
